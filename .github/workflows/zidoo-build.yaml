name: Zidoo Build

on:
  workflow_dispatch:
  push:
    branches:
      - Zidoo-Edition
    tags:
      - 'v*'

permissions:
  contents: write # needed to create releases for version tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Set up release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set - the APK will be signed with a throwaway debug key"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "STOREFILE=$RUNNER_TEMP/release.jks"
            echo "KEYALIAS=$SIGNING_KEY_ALIAS"
            echo "KEYPASSWORD=$SIGNING_KEY_PASSWORD"
            echo "STOREPASSWORD=$SIGNING_STORE_PASSWORD"
          } >> local.properties
      - name: Assemble release APK
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # tag v0.15.1 -> app version 0.15.1-zidoo_edition
            VERSION_ARG="-Pjellyfin.version=${GITHUB_REF_NAME#v}-zidoo_edition"
          fi
          ./gradlew --no-daemon assembleRelease $VERSION_ARG
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jellyfin-zidoo-apk
          retention-days: 14
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
